name: Auto-Deploy to Production VPS (Native LEMP)

on:
  push:
    branches: [ "main" ]

jobs:
  # =========================================================
  # JOB 1: Security Audit (SAST Scan)
  # =========================================================
  security_scan:
    name: 🛡️ Semgrep Code Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/php
        continue-on-error: true

  # =========================================================
  # JOB 2: Deploy ke VPS via SSH
  # =========================================================
  deploy:
    name: 🚀 Deploy ke VPS Ubuntu (Native LEMP)
    needs: [security_scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Menghubungi VPS dan Menjalankan Update Otomatis
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            echo "🚀 Menjalankan deployment di VPS..."
            cd /var/www/ukkmuhyiyuddin

            # Tarik kode terbaru dari GitHub
            git config --global --add safe.directory /var/www/ukkmuhyiyuddin
            git pull origin main

            # Install dependensi PHP & build frontend Tailwind CSS
            composer install --no-dev --optimize-autoloader --no-interaction
            npm install
            npm run build

            # Pastikan konfigurasi SMTP Gmail aktif di .env VPS
            touch .env
            grep -q "^MAIL_MAILER=" .env && sed -i 's/^MAIL_MAILER=.*/MAIL_MAILER=smtp/' .env || echo "MAIL_MAILER=smtp" >> .env
            grep -q "^MAIL_HOST=" .env && sed -i 's/^MAIL_HOST=.*/MAIL_HOST=smtp.gmail.com/' .env || echo "MAIL_HOST=smtp.gmail.com" >> .env
            grep -q "^MAIL_PORT=" .env && sed -i 's/^MAIL_PORT=.*/MAIL_PORT=587/' .env || echo "MAIL_PORT=587" >> .env
            grep -q "^MAIL_USERNAME=" .env && sed -i 's/^MAIL_USERNAME=.*/MAIL_USERNAME=ukkscp@gmail.com/' .env || echo "MAIL_USERNAME=ukkscp@gmail.com" >> .env
            grep -q "^MAIL_PASSWORD=" .env && sed -i 's/^MAIL_PASSWORD=.*/MAIL_PASSWORD=cpwhxpedhaxbkpvx/' .env || echo "MAIL_PASSWORD=cpwhxpedhaxbkpvx" >> .env
            grep -q "^MAIL_ENCRYPTION=" .env && sed -i 's/^MAIL_ENCRYPTION=.*/MAIL_ENCRYPTION=tls/' .env || echo "MAIL_ENCRYPTION=tls" >> .env
            grep -q "^MAIL_FROM_ADDRESS=" .env && sed -i 's/^MAIL_FROM_ADDRESS=.*/MAIL_FROM_ADDRESS=ukkscp@gmail.com/' .env || echo "MAIL_FROM_ADDRESS=ukkscp@gmail.com" >> .env
            grep -q "^MAIL_FROM_NAME=" .env && sed -i 's/^MAIL_FROM_NAME=.*/MAIL_FROM_NAME="Sistem Informasi Sekolah"/' .env || echo 'MAIL_FROM_NAME="Sistem Informasi Sekolah"' >> .env

            # Pastikan konfigurasi Resend HTTPS API (Port 443) aktif di .env VPS
            grep -q "^RESEND_API_KEY=" .env && sed -i 's/^RESEND_API_KEY=.*/RESEND_API_KEY=re_WaDxTmiD_Kh3AgnPYVHwt7wtcjKeJhTxx/' .env || echo "RESEND_API_KEY=re_WaDxTmiD_Kh3AgnPYVHwt7wtcjKeJhTxx" >> .env
            grep -q "^RESEND_FROM_EMAIL=" .env && sed -i 's/^RESEND_FROM_EMAIL=.*/RESEND_FROM_EMAIL=noreply@tugasukk.web.id/' .env || echo "RESEND_FROM_EMAIL=noreply@tugasukk.web.id" >> .env

            # Migrasi database TiDB Cloud jika ada perubahan tabel
            php artisan migrate --force

            # Optimalkan cache Laravel
            php artisan config:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Pastikan permission folder storage & cache aman untuk web server www-data
            chown -R www-data:www-data storage bootstrap/cache 2>/dev/null || true
            chmod -R 775 storage bootstrap/cache 2>/dev/null || true

            # Pastikan batas upload Nginx & PHP-FPM aman (mencegah error 413 Request Entity Too Large)
            echo "client_max_body_size 64M;" > /etc/nginx/conf.d/upload_limits.conf 2>/dev/null || true
            if [ -f /etc/nginx/nginx.conf ]; then
                if grep -q "client_max_body_size" /etc/nginx/nginx.conf; then
                    sed -i 's/client_max_body_size .*/client_max_body_size 64M;/' /etc/nginx/nginx.conf
                else
                    sed -i '/http {/a \    client_max_body_size 64M;' /etc/nginx/nginx.conf
                fi
                nginx -t 2>/dev/null && systemctl reload nginx 2>/dev/null || true
            fi

            for php_ini in /etc/php/*/fpm/php.ini /etc/php/*/cli/php.ini; do
                if [ -f "$php_ini" ]; then
                    sed -i 's/^upload_max_filesize = .*/upload_max_filesize = 64M/' "$php_ini"
                    sed -i 's/^post_max_size = .*/post_max_size = 64M/' "$php_ini"
                    sed -i 's/^memory_limit = .*/memory_limit = 256M/' "$php_ini"
                fi
            done
            mkdir -p /etc/php/8.4/fpm/conf.d 2>/dev/null || true
            printf "upload_max_filesize = 64M\npost_max_size = 64M\nmemory_limit = 256M\nmax_execution_time = 120\n" > /etc/php/8.4/fpm/conf.d/99-upload-limits.ini 2>/dev/null || true

            # Restart worker & reload PHP-FPM
            systemctl reload php8.4-fpm 2>/dev/null || systemctl restart php8.4-fpm 2>/dev/null || true
            systemctl restart ukk-worker.service 2>/dev/null || true

            echo "✅ Deployment Selesai & Aplikasi Live di https://tugasukk.web.id!"

