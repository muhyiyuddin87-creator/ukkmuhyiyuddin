name: Auto-Deploy to Production VPS (Native LEMP)

on:
  push:
    branches: [ "main" ]

jobs:
  # =========================================================
  # JOB 1: Security Audit (SAST Scan)
  # =========================================================
  security_scan:
    name: 🛡️ Semgrep Code Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/php
        continue-on-error: true

  # =========================================================
  # JOB 2: Deploy ke VPS via SSH
  # =========================================================
  deploy:
    name: 🚀 Deploy ke VPS Ubuntu (Native LEMP)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Menghubungi VPS dan Menjalankan Update Otomatis
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            echo "🚀 Menjalankan deployment di VPS..."

            # -------------------------------------------------------------
            # Helper sudo aman non-interaktif
            # -------------------------------------------------------------
            PASS="${{ secrets.VPS_PASSWORD }}"
            run_sudo() {
                if [ "$(id -u)" -eq 0 ]; then
                    "$@"
                elif [ -n "$PASS" ]; then
                    echo "$PASS" | sudo -S -p '' "$@"
                else
                    sudo -n "$@" 2>/dev/null || sudo "$@"
                fi
            }

            # -------------------------------------------------------------
            # Konfigurasi batas upload Nginx & PHP 64M (Cegah Error 413)
            # -------------------------------------------------------------
            echo "client_max_body_size 64M;" | run_sudo tee /etc/nginx/conf.d/upload_limits.conf > /dev/null 2>&1 || true

            if [ -f /etc/nginx/nginx.conf ]; then
                run_sudo sed -i 's/client_max_body_size [^;]*;/client_max_body_size 64M;/g' /etc/nginx/nginx.conf 2>/dev/null || true
                if ! grep -q "client_max_body_size" /etc/nginx/nginx.conf; then
                    run_sudo sed -i '/http {/a \    client_max_body_size 64M;' /etc/nginx/nginx.conf 2>/dev/null || true
                fi
            fi

            for f in /etc/nginx/sites-enabled/* /etc/nginx/sites-available/*; do
                if [ -f "$f" ]; then
                    run_sudo sed -i 's/client_max_body_size [^;]*;/client_max_body_size 64M;/g' "$f" 2>/dev/null || true
                    if ! grep -q "client_max_body_size" "$f"; then
                        run_sudo sed -i '/server {/a \    client_max_body_size 64M;' "$f" 2>/dev/null || true
                    fi
                fi
            done

            run_sudo nginx -t 2>/dev/null && (run_sudo systemctl restart nginx 2>/dev/null || run_sudo systemctl reload nginx 2>/dev/null || run_sudo nginx -s reload 2>/dev/null) || true

            for d in /etc/php/*/fpm/conf.d; do
                if [ -d "$d" ]; then
                    printf "upload_max_filesize = 64M\npost_max_size = 64M\nmemory_limit = 256M\nmax_execution_time = 180\n" | run_sudo tee "$d/99-upload-limits.ini" > /dev/null 2>&1 || true
                fi
            done
            for d in /etc/php/*/fpm/php.ini; do
                if [ -f "$d" ]; then
                    run_sudo sed -i 's/^upload_max_filesize = .*/upload_max_filesize = 64M/' "$d" 2>/dev/null || true
                    run_sudo sed -i 's/^post_max_size = .*/post_max_size = 64M/' "$d" 2>/dev/null || true
                fi
            done
            run_sudo systemctl reload php8.4-fpm 2>/dev/null || run_sudo systemctl reload php*-fpm 2>/dev/null || true

            cd /var/www/ukkmuhyiyuddin

            # Tarik kode terbaru dari GitHub
            git config --global --add safe.directory /var/www/ukkmuhyiyuddin
            git pull origin main

            # Install dependensi PHP & build frontend Tailwind CSS
            composer install --no-dev --optimize-autoloader --no-interaction
            npm install
            npm run build

            # Install dependensi Python untuk Ekstraksi Jadwal PDF (pdfplumber)
            echo "🐍 Memeriksa dan menginstall dependensi Python pdfplumber di VPS..."
            run_sudo apt-get update -y 2>/dev/null || true
            run_sudo apt-get install -y python3-pip python3-pdfplumber python-is-python3 2>/dev/null || true
            run_sudo pip3 install pdfplumber --break-system-packages 2>/dev/null || run_sudo pip install pdfplumber --break-system-packages 2>/dev/null || pip3 install pdfplumber 2>/dev/null || true
            python3 -c "import pdfplumber; print('✅ pdfplumber siap digunakan')" || echo "⚠️ pdfplumber belum terinstall"

            # Pastikan konfigurasi SMTP Gmail aktif di .env VPS
            touch .env
            grep -q "^MAIL_MAILER=" .env && sed -i 's/^MAIL_MAILER=.*/MAIL_MAILER=smtp/' .env || echo "MAIL_MAILER=smtp" >> .env
            grep -q "^MAIL_HOST=" .env && sed -i 's/^MAIL_HOST=.*/MAIL_HOST=smtp.gmail.com/' .env || echo "MAIL_HOST=smtp.gmail.com" >> .env
            grep -q "^MAIL_PORT=" .env && sed -i 's/^MAIL_PORT=.*/MAIL_PORT=587/' .env || echo "MAIL_PORT=587" >> .env
            grep -q "^MAIL_USERNAME=" .env && sed -i 's/^MAIL_USERNAME=.*/MAIL_USERNAME=ukkscp@gmail.com/' .env || echo "MAIL_USERNAME=ukkscp@gmail.com" >> .env
            grep -q "^MAIL_PASSWORD=" .env && sed -i 's/^MAIL_PASSWORD=.*/MAIL_PASSWORD=cpwhxpedhaxbkpvx/' .env || echo "MAIL_PASSWORD=cpwhxpedhaxbkpvx" >> .env
            grep -q "^MAIL_ENCRYPTION=" .env && sed -i 's/^MAIL_ENCRYPTION=.*/MAIL_ENCRYPTION=tls/' .env || echo "MAIL_ENCRYPTION=tls" >> .env
            grep -q "^MAIL_FROM_ADDRESS=" .env && sed -i 's/^MAIL_FROM_ADDRESS=.*/MAIL_FROM_ADDRESS=ukkscp@gmail.com/' .env || echo "MAIL_FROM_ADDRESS=ukkscp@gmail.com" >> .env
            grep -q "^MAIL_FROM_NAME=" .env && sed -i 's/^MAIL_FROM_NAME=.*/MAIL_FROM_NAME="Sistem Informasi Sekolah"/' .env || echo 'MAIL_FROM_NAME="Sistem Informasi Sekolah"' >> .env

            # Pastikan konfigurasi Resend HTTPS API (Port 443) aktif di .env VPS
            grep -q "^RESEND_API_KEY=" .env && sed -i 's/^RESEND_API_KEY=.*/RESEND_API_KEY=re_WaDxTmiD_Kh3AgnPYVHwt7wtcjKeJhTxx/' .env || echo "RESEND_API_KEY=re_WaDxTmiD_Kh3AgnPYVHwt7wtcjKeJhTxx" >> .env
            grep -q "^RESEND_FROM_EMAIL=" .env && sed -i 's/^RESEND_FROM_EMAIL=.*/RESEND_FROM_EMAIL=noreply@tugasukk.web.id/' .env || echo "RESEND_FROM_EMAIL=noreply@tugasukk.web.id" >> .env

            # Migrasi database TiDB Cloud jika ada perubahan tabel
            php artisan migrate --force

            # Optimalkan cache Laravel
            php artisan config:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Pastikan permission folder storage & cache aman untuk web server www-data
            chown -R www-data:www-data storage bootstrap/cache 2>/dev/null || true
            chmod -R 775 storage bootstrap/cache 2>/dev/null || true

            # Restart worker & reload PHP-FPM
            sudo systemctl reload php8.4-fpm 2>/dev/null || systemctl reload php8.4-fpm 2>/dev/null || true
            sudo systemctl restart ukk-worker.service 2>/dev/null || systemctl restart ukk-worker.service 2>/dev/null || true

            echo "✅ Deployment Selesai & Aplikasi Live di https://tugasukk.web.id!"

